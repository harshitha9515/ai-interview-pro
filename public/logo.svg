<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#090D16" stroke="url(#primary-grad)" stroke-width="3" />
  <!-- AI Neural Core -->
  <circle cx="50" cy="50" r="26" fill="#111A30" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3 3" />
  <!-- Wave / Voice elements -->
  <path d="M34 50 L34 50 M42 42 L42 58 M50 36 L50 64 M58 42 L58 58 M66 50 L66 50" stroke="url(#primary-grad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <!-- Bot Eyes / Accents -->
  <circle cx="38" cy="30" r="3" fill="#06b6d4" />
  <circle cx="62" cy="30" r="3" fill="#a855f7" />
  <path d="M44 26 L56 26" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
</svg>
